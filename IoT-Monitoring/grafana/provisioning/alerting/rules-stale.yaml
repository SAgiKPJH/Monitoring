# 데이터 끊김 알림 — 방마다 30분(경고) / 60분(연결 끊김).
# API 의 /api/readings/status 가 마지막 수신 후 경과 분(ageMinutes)을 계산해 주므로
# Grafana 는 그 값을 임계값과 비교하기만 하면 된다.
#   ageMinutes = -1  → 한 번도 데이터 없음 (임계값에 안 걸림, 알림 안 감)
# 평가 주기는 5분 (끊김 감지에 1분 단위 정밀도는 불필요).
apiVersion: 1

groups:
  - orgId: 1
    name: iot-stale-BRB
    folder: IoT Alerts
    interval: 5m
    rules:
      - uid: brb_stale_warn
        title: 데이터 경고 (BRB)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels: { severity: 경고, deviceId: BRB }
        annotations:
          summary: '📡 경고 — BRB(아기 침대 옆) 30분째 데이터 없음 (마지막 수신 후 {{ printf "%.0f" $values.B.Value }}분)'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: iot-infinity
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: iot-infinity }
              type: json
              source: url
              parser: backend
              format: table
              url: http://api:8080/api/readings/status?devices=BRB
              url_options: { method: GET }
              root_selector: devices
              filterExpression: "deviceId == 'BRB'"
              columns:
                - { selector: ageMinutes, text: ageMinutes, type: number }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A, datasource: { type: __expr__, uid: __expr__ } }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [30] }

      - uid: brb_stale_offline
        title: 데이터 연결 끊김 (BRB)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels: { severity: 위험, deviceId: BRB }
        annotations:
          summary: '📡 연결 끊김 — BRB(아기 침대 옆) 60분째 데이터 없음 (마지막 수신 후 {{ printf "%.0f" $values.B.Value }}분)'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: iot-infinity
            model:
              refId: A
              datasource: { type: yesoreyeram-infinity-datasource, uid: iot-infinity }
              type: json
              source: url
              parser: backend
              format: table
              url: http://api:8080/api/readings/status?devices=BRB
              url_options: { method: GET }
              root_selector: devices
              filterExpression: "deviceId == 'BRB'"
              columns:
                - { selector: ageMinutes, text: ageMinutes, type: number }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A, datasource: { type: __expr__, uid: __expr__ } }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [60] }

