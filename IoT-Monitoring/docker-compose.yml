name: iot-monitoring

x-common: &common
  restart: unless-stopped
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongo:
    <<: *common
    image: mongo:7
    container_name: iot-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-monitoring}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-iot}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-iotpass}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - iotnet
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *common
    build:
      context: ./api
    container_name: iot-api
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: mongodb://${MONGO_APP_USERNAME:-iot}:${MONGO_APP_PASSWORD:-iotpass}@mongo:27017/${MONGO_DB:-monitoring}?authSource=${MONGO_DB:-monitoring}
      MongoDb__DatabaseName: ${MONGO_DB:-monitoring}
      MongoDb__CollectionName: readings
      Api__ApiKey: ${API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - iotnet

  grafana:
    <<: *common
    # NOTE: Grafana 와 Infinity 플러그인은 **버전 짝**이 맞아야 한다 (아래 GF_INSTALL_PLUGINS 참고).
    #   - Grafana 11.6~12.2 + Infinity 3.11.1 이하
    #   - Grafana 12.3+     + Infinity 3.11.2 이상  ← 현재 조합
    # 어긋나면 패널이 안 뜨고 "Minified React error #130" 또는
    # "Could not load plugin: 404 loading react/jsx-runtime" 가 난다.
    # ⚠️ 버전을 올리면 Grafana DB 가 자동 마이그레이션되어 **다운그레이드 불가**
    #    (되돌리려면 grafana_data 볼륨 삭제 → provisioning 으로 재구성).
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.2}
    container_name: iot-grafana
    depends_on:
      - api
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Infinity 버전 고정 (재현성). Grafana 와 짝을 맞춰야 한다:
      #   3.11.2+ 는 react/jsx-runtime 를 externalize → **Grafana 12.3.0 이상** 필요
      #   3.11.1  이하는 번들에 포함        → Grafana 11.6 ~ 12.2 에서 사용
      #   (플러그인이 선언한 grafanaDependency ">=11.6.0" 은 실제와 다르므로 신뢰하지 말 것)
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource ${INFINITY_PLUGIN_VERSION:-3.11.2}
      GF_AUTH_ANONYMOUS_ENABLED: "false"    # 로그인해야 대시보드 열람 가능
      GF_USERS_ALLOW_SIGN_UP: "false"       # 자가 가입 차단 (관리자가 계정 생성)
      # 로그인 유지 기간 — 미접속 N 뒤 자동 로그아웃 / 최대 유지 기간 (예: 12h, 7d, 30d)
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: ${GRAFANA_SESSION_IDLE:-30d}
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: ${GRAFANA_SESSION_MAX:-90d}
      # 로그인 실패 잠금 (5회 실패 시 5분 차단) — 무차별 대입 방어
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}   # 로그인 성공/실패가 로그에 남음
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"   # allow the camera <img>/<iframe> in a Text panel
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}   # Slack incoming webhook (alerting provisioning에서 사용)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/iot-monitoring.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/img:/usr/share/grafana/public/img/custom:ro   # floor plan (house.png) for the Canvas panel
    networks:
      - iotnet

  # Optional admin UI for inspecting the MongoDB data — browse http://localhost:8081
  mongo-express:
    <<: *common
    image: mongo-express:1.0.2
    container_name: iot-mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - iotnet

  # Camera: RTSP -> browser stream (WebRTC/MJPEG) so Grafana can embed it.
  # The camera MUST expose RTSP/ONVIF. Put its RTSP URL in go2rtc/go2rtc.yaml.
  go2rtc:
    <<: *common
    image: alexxit/go2rtc:latest
    container_name: iot-go2rtc
    ports:
      - "${GO2RTC_PORT:-1984}:1984"   # web UI + API (stream.html / stream.mjpeg / snapshot)
      - "8555:8555/tcp"               # WebRTC
      - "8555:8555/udp"
    environment:
      TUYA_EMAIL: ${TUYA_EMAIL:-}
      TUYA_PASSWORD: ${TUYA_PASSWORD:-}
      TUYA_DEVICE_ID: ${TUYA_DEVICE_ID:-}
    volumes:
      - ./go2rtc:/config
    networks:
      - iotnet

  # go2rtc's Tuya cloud WebRTC stream degrades after ~3 days of uptime.
  # This sidecar bounces ONLY the go2rtc container every 2 days to keep it healthy.
  # (Needs the Docker socket to issue the restart — home-lab trade-off.)
  go2rtc-restarter:
    <<: *common
    image: docker:cli
    container_name: iot-go2rtc-restarter
    depends_on:
      - go2rtc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep ${GO2RTC_RESTART_SECONDS:-172800}   # default 2 days
          echo "[restarter] restarting go2rtc..."
          docker restart iot-go2rtc || echo "[restarter] restart failed"
        done

networks:
  iotnet:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:
