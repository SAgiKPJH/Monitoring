services:
  baby-timelapse:
    build: .
    container_name: baby-timelapse
    # LAN 의 go2rtc(172.30.1.42:1984) 접근 — Linux(Mint)에서 host 네트워크가 가장 간단.
    # bridge 로 쓰려면 이 줄을 지우고 STREAM_URL 호스트가 컨테이너에서 닿는지 확인.
    network_mode: host
    restart: unless-stopped
    # 모든 설정(전송 경로 등)은 .env 에서 — cp .env_sample .env 후 값 채우기
    env_file:
      - .env
    volumes:
      - ./id_rsa:/keys/id_rsa:ro   # SSH 개인키(원격 전송용, 데이터 아님)
      - ./captures:/app/captures   # 상대경로 스테이징 — 전송 성공 시 삭제됨(KEEP_LOCAL=0)
      #   ① ssh-keygen -t ed25519 -f ./id_rsa -N ""
      #   ② ssh-copy-id -i ./id_rsa.pub user@원격IP
