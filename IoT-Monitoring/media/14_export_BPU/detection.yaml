# hb_mapper 설정 — detection (yolo11n, baby/baby_face 2클래스) → RDK X5 BPU .bin
# 실행: OE docker 안에서  hb_mapper makertbin --config detection.yaml --model-type onnx   (convert.sh 참고)
model_parameters:
  onnx_model: 'onnx/detection.onnx'
  march: 'bayes-e'                       # RDK X5
  working_dir: 'out/detection'
  output_model_file_prefix: 'detection'
  layer_out_dump: False

input_parameters:
  input_name: 'images'
  # 런타임(보드) 입력: cv2 BGR uint8 NHWC 그대로 투입 (15_rdk_x5_runtime/src/vision_bpu 가 letterbox 만 함)
  input_type_rt: 'bgr'
  input_layout_rt: 'NHWC'
  # 학습/ONNX 입력: RGB float NCHW, /255 정규화 (ultralytics) — 색변환·스케일을 .bin 에 내장
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451        # 1/255

calibration_parameters:
  cal_data_dir: 'calib/frames'          # calib_prep.py 가 만든 전체 프레임 jpg
  cal_data_type: 'uint8'
  preprocess_on: True                   # hb_mapper 가 jpg 를 직접 리사이즈/색변환
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
  core_num: 1
