# hb_mapper 설정 — pose (yolo11n-pose, baby 17 keypoint) → RDK X5 BPU .bin
# 실행: OE docker 안에서  hb_mapper makertbin --config pose.yaml --model-type onnx   (convert.sh 참고)
model_parameters:
  onnx_model: 'onnx/pose.onnx'
  march: 'bayes-e'                       # RDK X5
  working_dir: 'out/pose'
  output_model_file_prefix: 'pose'
  layer_out_dump: False

input_parameters:
  input_name: 'images'
  input_type_rt: 'bgr'                  # 보드: cv2 BGR uint8 NHWC 그대로 (letterbox 만)
  input_layout_rt: 'NHWC'
  input_type_train: 'rgb'               # ONNX: RGB float NCHW /255 (ultralytics)
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451        # 1/255

calibration_parameters:
  cal_data_dir: 'calib/frames'
  cal_data_type: 'uint8'
  preprocess_on: True
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
  core_num: 1
