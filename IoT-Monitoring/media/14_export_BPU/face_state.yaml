# hb_mapper 설정 — face_state (mobilenet_v2 멀티라벨 4속성, 128x128) → RDK X5 BPU .bin
# 실행: OE docker 안에서  hb_mapper makertbin --config face_state.yaml --model-type onnx   (convert.sh 참고)
model_parameters:
  onnx_model: 'onnx/face_state.onnx'
  march: 'bayes-e'                       # RDK X5
  working_dir: 'out/face_state'
  output_model_file_prefix: 'face_state'
  layer_out_dump: False

input_parameters:
  input_name: 'images'
  # 보드: cv2 BGR uint8 NHWC 리사이즈만 (15_rdk_x5_runtime/src/face_state_bpu). 학습도 BGR(변환 없음) → 색변환 없음
  input_type_rt: 'bgr'
  input_layout_rt: 'NHWC'
  input_type_train: 'bgr'
  input_layout_train: 'NCHW'
  input_shape: '1x3x128x128'
  # 학습 전처리 (x/255 - 0.5)/0.5 = (x - 127.5)/127.5 를 .bin 에 내장
  norm_type: 'data_mean_and_scale'
  mean_value: '127.5 127.5 127.5'
  scale_value: '0.007843137254902 0.007843137254902 0.007843137254902'   # 1/127.5

calibration_parameters:
  cal_data_dir: 'calib/faces'           # calib_prep.py 가 만든 baby_face 크롭 jpg
  cal_data_type: 'uint8'
  preprocess_on: True
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
  core_num: 1
